name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gradle-tests:
    name: Gradle JVM unit tests (fail-closed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Intentional replacement of the recovered `bash test.sh || true` workflow.
      # No `|| true`: the step fails when Gradle fails, and Gradle fails when any
      # module's unit tests fail. `bash test.sh` runs `./gradlew test` across all
      # modules (see test.sh).
      - name: Unit tests (all Gradle modules)
        run: bash test.sh
